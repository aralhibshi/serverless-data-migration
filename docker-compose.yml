# Local emulators for the integration tests: DynamoDB Local (AWS) and ElasticMQ (SQS-compatible).
services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb
    ports:
      - '8000:8000'
  sqs:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - '9324:9324'
