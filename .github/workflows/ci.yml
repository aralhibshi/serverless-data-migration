name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, type-check, unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Start emulators (DynamoDB Local, ElasticMQ)
        run: npm run emulators:up

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and integration tests, with coverage thresholds
        run: npm run test:coverage

      - name: Stop emulators
        if: always()
        run: npm run emulators:down
